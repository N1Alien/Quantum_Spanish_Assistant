services:
  - type: web
    name: quantum-spanish-backend
    env: python
    plan: free
    rootDir: ./
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: DATABASE_URL
        sync: false
      - key: API_V1_STR
        value: /api/v1
      - key: ENABLE_WEB_INGESTION
        value: "true"
      - key: VECTOR_DB_PROVIDER
        value: pgvector
      - key: PGVECTOR_CONNECTION_STRING
        sync: false
      - key: PGVECTOR_COLLECTION
        value: quantum_spanish_docs

  - type: web
    name: quantum-spanish-frontend
    env: python
    plan: free
    rootDir: ./
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FASTAPI_URL
        sync: false
